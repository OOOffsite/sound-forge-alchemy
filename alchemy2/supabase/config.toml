# Sound Forge Alchemy - Supabase Configuration
# Date: 2025-12-16
# Version: 1.0.0

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.audio-files]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["audio/mpeg", "audio/wav", "audio/flac", "audio/ogg"]

[storage.buckets.stems]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["audio/mpeg", "audio/wav", "audio/flac"]

[auth]
enabled = false
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = false
enable_confirmations = false

[realtime]
enabled = true
ip_version = "ipv4"

# Realtime multiplayer settings
[realtime.tenants.realtime-dev]
max_channels_per_client = 100
max_joins_per_second = 500
