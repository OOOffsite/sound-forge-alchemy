# Optimized Docker Compose Configuration
# Features: Shared base images, build caching, efficient layering

x-common-variables: &common-variables
  NODE_ENV: ${NODE_ENV:-development}
  REDIS_URL: redis://redis:6379

x-node-service: &node-service
  build:
    context: .
    cache_from:
      - sound-forge-node-base:latest
    target: ${NODE_ENV:-development}
  restart: unless-stopped
  networks:
    - internal

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ===================
  # BASE IMAGES (Build these first)
  # ===================
  node-base:
    build:
      context: .
      dockerfile: docker/base/Dockerfile.node-base-optimized
      target: ${NODE_ENV:-development}
      cache_from:
        - node:20-alpine
      tags:
        - sound-forge-node-base:latest
        - sound-forge-node-base:${NODE_ENV:-development}
    image: sound-forge-node-base:latest
    profiles: ["build"]

  python-node-base:
    build:
      context: .
      dockerfile: docker/base/Dockerfile.python-node-base-optimized
      target: ${NODE_ENV:-development}
      cache_from:
        - node:20-alpine
        - sound-forge-node-base:latest
      tags:
        - sound-forge-python-node-base:latest
        - sound-forge-python-node-base:${NODE_ENV:-development}
    image: sound-forge-python-node-base:latest
    profiles: ["build"]
    depends_on:
      - node-base

  # ===================
  # FRONTEND SERVICE
  # ===================
  frontend:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.frontend-optimized
      target: ${NODE_ENV:-development}
      cache_from:
        - node:20-alpine
        - nginx:alpine
    ports:
      - "8001:8001"
    environment:
      <<: *common-variables
      VITE_API_URL: http://localhost:3000
      VITE_WEBSOCKET_URL: ws://localhost:3006
    networks:
      - external
      - internal
    volumes:
      - ./src:/app/src:cached
      - ./public:/app/public:cached
    depends_on:
      - api-gateway
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8001"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-0.8}
          memory: ${FRONTEND_MEMORY_LIMIT:-1G}

  # ===================
  # API GATEWAY
  # ===================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: ../../docker/services/Dockerfile.node-complete
      target: ${NODE_ENV:-development}
      cache_from:
        - sound-forge-node-base:latest
      args:
        BASE_IMAGE: sound-forge-node-base:latest
    ports:
      - "3000:3000"
    environment:
      <<: *common-variables
      PORT: 3000
      SERVICE_NAME: api-gateway
      SPOTIFY_SERVICE_URL: http://spotify-service:3001
      DOWNLOAD_SERVICE_URL: http://download-service:3002
      PROCESSING_SERVICE_URL: http://processing-service:3003
      ANALYSIS_SERVICE_URL: http://analysis-service:3004
      WEBSOCKET_SERVICE_URL: http://websocket-service:3006
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    networks:
      - external
      - internal
    volumes:
      - shared_audio:/app/audio_data
      - shared_logs:/app/logs
      - ./backend/api-gateway/src:/app/src:cached
      - ./backend/api-gateway/config:/app/config:ro
    depends_on:
      node-base:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
      spotify-service:
        condition: service_started
      download-service:
        condition: service_started
      processing-service:
        condition: service_started
      analysis-service:
        condition: service_started
      websocket-service:
        condition: service_started
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${API_GATEWAY_CPU_LIMIT:-0.5}
          memory: ${API_GATEWAY_MEMORY_LIMIT:-512M}

  # ===================
  # BACKEND SERVICES (Using template pattern)
  # ===================
  spotify-service:
    <<: *node-service
    build:
      context: ./backend/spotify
      dockerfile: ../../docker/services/Dockerfile.spotify-service
      target: ${NODE_ENV:-development}
      cache_from:
        - sound-forge-node-base:latest
      args:
        BASE_IMAGE: sound-forge-node-base:latest
        SERVICE_NAME: spotify-service
        SERVICE_PORT: 3001
    ports:
      - "3001:3001"
    environment:
      <<: *common-variables
      PORT: 3001
      SERVICE_NAME: spotify-service
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_API_MODE: spotdl
    volumes:
      - shared_logs:/app/logs
      - ./backend/spotify/src:/app/src:cached
      - ./backend/spotify/config:/app/config:ro
    depends_on:
      node-base:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${SPOTIFY_CPU_LIMIT:-0.3}
          memory: ${SPOTIFY_MEMORY_LIMIT:-256M}

  download-service:
    <<: *node-service
    build:
      context: ./backend/download
      dockerfile: ../../docker/services/Dockerfile.node-complete
      target: ${NODE_ENV:-development}
      cache_from:
        - sound-forge-node-base:latest
      args:
        BASE_IMAGE: sound-forge-node-base:latest
        SERVICE_NAME: download-service
        SERVICE_PORT: 3002
    ports:
      - "3002:3002"
    environment:
      <<: *common-variables
      PORT: 3002
      SERVICE_NAME: download-service
      AUDIO_DATA_PATH: /app/audio_data
      TMP_PATH: /app/tmp
    volumes:
      - shared_audio:/app/audio_data
      - shared_tmp:/app/tmp
      - shared_logs:/app/logs
      - ./backend/download/src:/app/src:cached
      - ./backend/download/config:/app/config:ro
    depends_on:
      node-base:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${DOWNLOAD_CPU_LIMIT:-0.5}
          memory: ${DOWNLOAD_MEMORY_LIMIT:-512M}

  processing-service:
    build:
      context: ./backend/processing
      dockerfile: ../../docker/services/Dockerfile.simple-node
      cache_from:
        - sound-forge-python-node-base:latest
      args:
        BASE_IMAGE: sound-forge-python-node-base:latest
    ports:
      - "3003:3003"
    environment:
      <<: *common-variables
      PORT: 3003
      SERVICE_NAME: processing-service
      AUDIO_DATA_PATH: /app/audio_data
      CACHE_PATH: /app/cache
      WEBSOCKET_SERVICE_URL: http://websocket-service:3006
      USE_GPU: ${USE_GPU:-false}
      GPU_COUNT: ${GPU_COUNT:-1}
    networks:
      - internal
    volumes:
      - shared_audio:/app/audio_data
      - shared_cache:/app/cache
      - shared_logs:/app/logs
      - ./backend/processing/src:/app/src:cached
      - ./backend/processing/config:/app/config:ro
      - ./backend/processing/scripts:/app/scripts:cached
      - /app/models
    depends_on:
      python-node-base:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
      websocket-service:
        condition: service_started
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${PROCESSING_CPU_LIMIT:-2.0}
          memory: ${PROCESSING_MEMORY_LIMIT:-4G}

  analysis-service:
    <<: *node-service
    build:
      context: ./backend/analysis
      dockerfile: ../../docker/services/Dockerfile.simple-node
      cache_from:
        - sound-forge-node-base:latest
      args:
        BASE_IMAGE: sound-forge-node-base:latest
        SERVICE_NAME: analysis-service
        SERVICE_PORT: 3004
    ports:
      - "3004:3004"
    environment:
      <<: *common-variables
      PORT: 3004
      SERVICE_NAME: analysis-service
      AUDIO_DATA_PATH: /app/audio_data
    volumes:
      - shared_audio:/app/audio_data
      - shared_logs:/app/logs
      - ./backend/analysis/src:/app/src:cached
      - ./backend/analysis/config:/app/config:ro
    depends_on:
      node-base:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${ANALYSIS_CPU_LIMIT:-0.5}
          memory: ${ANALYSIS_MEMORY_LIMIT:-512M}

  websocket-service:
    <<: *node-service
    build:
      context: ./backend/websocket
      dockerfile: ../../docker/services/Dockerfile.simple-node
      cache_from:
        - sound-forge-node-base:latest
      args:
        BASE_IMAGE: sound-forge-node-base:latest
        SERVICE_NAME: websocket-service
        SERVICE_PORT: 3006
    ports:
      - "3006:3006"
    environment:
      <<: *common-variables
      PORT: 3006
      SERVICE_NAME: websocket-service
    volumes:
      - shared_logs:/app/logs
      - ./backend/websocket/src:/app/src:cached
      - ./backend/websocket/config:/app/config:ro
    depends_on:
      node-base:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${WEBSOCKET_CPU_LIMIT:-0.3}
          memory: ${WEBSOCKET_MEMORY_LIMIT:-256M}

  # ===================
  # DATA SERVICES
  # ===================
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - internal
    volumes:
      - redis_data:/data
      - ./docker/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server --appendonly yes
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["dev", "prod"]
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-0.5}
          memory: ${REDIS_MEMORY_LIMIT:-1G}

  # ===================
  # DEVELOPMENT TOOLS
  # ===================
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - internal
    depends_on:
      - redis
    profiles: ["dev"]

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - internal
    profiles: ["dev"]

# ===================
# NETWORKS
# ===================
networks:
  external:
    name: sound-forge-external
    driver: bridge
    
  internal:
    name: sound-forge-internal
    driver: bridge

# ===================
# VOLUMES
# ===================
volumes:
  shared_audio:
    name: sound-forge-audio-data
    driver: local
    
  shared_cache:
    name: sound-forge-cache
    driver: local
    
  shared_tmp:
    name: sound-forge-tmp
    driver: local
    
  shared_logs:
    name: sound-forge-logs
    driver: local

  redis_data:
    name: sound-forge-redis-data
    driver: local